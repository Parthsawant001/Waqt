{% extends 'base.html' %}
{% block title %}Sign In — Waqt (वेळ){% endblock %}

{% block content %}
<div class="waqt-container" style="max-width: 460px; margin: 60px auto;">
  <div style="background: #fff; border: var(--border-subtle); border-radius: var(--radius-md); padding: 40px; box-shadow: var(--shadow-medium);">
    <div style="text-align: center; margin-bottom: 28px;">
      <span class="marathi-accent" style="font-size: 24px;">वेळ</span>
      <h2 style="font-size: 28px; margin: 8px 0 4px 0;">Sign In</h2>
      <p style="font-size: 14px; color: var(--driftwood);">Access your reservations, live queues, or restaurant floor.</p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        {{ form.username }}
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        {{ form.password }}
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Sign In</button>
    </form>

    <div style="margin-top: 24px; padding-top: 20px; border-top: var(--border-subtle); text-align: center; font-size: 13px; color: var(--driftwood);">
      New to Waqt? 
      <a href="{% url 'accounts:customer_register' %}" style="color: var(--turmeric); font-weight: 600;">Sign up as Diner</a> or 
      <a href="{% url 'accounts:owner_register' %}" style="color: var(--deep-tide); font-weight: 600;">Register Restaurant</a>
    </div>
  </div>
</div>
{% endblock %}
