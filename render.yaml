services:
  - type: web
    name: waqt-coastal
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn waqt_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DB_ENGINE
        value: sqlite
